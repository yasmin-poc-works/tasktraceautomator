name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-test:
    name: Backend Lint, Type Check & Test (API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff Lint and Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy Type Check
        run: |
          mypy config apps agents providers schemas

      - name: Run Pytest
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-test-secret-key-must-be-long-enough-for-validation
        run: |
          pytest tests/unit/

  frontend-lint-and-test:
    name: Frontend Lint, Type Check & Test (App)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: ESLint
        run: npm run lint || true

      - name: TypeScript Check
        run: npm run typecheck || true

      - name: Vitest Component Tests
        run: npm run test:run || true
